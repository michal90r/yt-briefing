# Dev-only hardening (nie publikowane — bunfig.toml nie jest w `files` w package.json).
# Chroni LOKALNE `bun install`/`bun add` przed świeżo opublikowanymi (potencjalnie
# skompromitowanymi) wersjami. W CI z `--frozen-lockfile` nie ma rozwiązywania wersji,
# więc cooldown jest tam nieistotny — instalacja idzie 1:1 z zacommitowanego bun.lock.
#
# Wymaga Bun >= 1.3 (lokalnie 1.3.14). Wartość w sekundach.
[install]
# 7 dni — większość ataków na łańcuch dostaw wykrywa się w godziny/dni.
# Pilny fix bezpieczeństwa wymagający najnowszej wersji: nadpisz jednorazowo z CLI.
minimumReleaseAge = 604800
# Pakiety wyłączone z karencji (puste = maksymalna ochrona).
minimumReleaseAgeExcludes = []

# Warstwa 4 — audyt przed instalacją (Bun 1.3 Security Scanner API).
# Skaner Socket blokuje potwierdzone malware i ostrzega o zagrożeniach wykrytych
# przez AI; uzupełnia cooldown (wykrywa ATAK, nie tylko świeżość/znane CVE).
# Tryb darmowy działa bez tokenu (publiczne API Socket); SOCKET_API_KEY opcjonalny
# tylko dla polityk organizacji. Musi być w devDependencies (inaczej Bun zgłasza
# SecurityScannerNotInDependencies). Uwaga: woła sieć przy każdej instalacji.
[install.security]
scanner = "@socketsecurity/bun-security-scanner"
