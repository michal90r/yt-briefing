# Dev-only hardening (not published — bunfig.toml is not in `files` in package.json).
# Protects LOCAL `bun install`/`bun add` against freshly published (potentially
# compromised) versions. In CI with `--frozen-lockfile` there is no version
# resolution, so the cooldown is irrelevant there — the install matches the
# committed bun.lock 1:1.
#
# Requires Bun >= 1.3 (1.3.14 locally). Value in seconds.
[install]
# 7 days — most supply-chain attacks are caught within hours/days.
# Urgent security fix that needs the latest version: override once from the CLI.
minimumReleaseAge = 604800
# Packages excluded from the cooldown (empty = maximum protection).
minimumReleaseAgeExcludes = []

# Layer 4 — pre-install audit (Bun 1.3 Security Scanner API).
# The Socket scanner blocks confirmed malware and warns about threats detected
# by AI; it complements the cooldown (it detects an ATTACK, not just freshness/known CVEs).
# Free tier works without a token (public Socket API); SOCKET_API_KEY is optional,
# only for org policies. Must live in devDependencies (otherwise Bun reports
# SecurityScannerNotInDependencies). Note: it hits the network on every install.
[install.security]
scanner = "@socketsecurity/bun-security-scanner"
